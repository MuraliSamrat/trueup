[project]
name = "trueup"
version = "0.1.0"
description = "Agent-safe payment settlement for services whose price changes on site (PayPal + AI)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "fastmcp>=4.1.6",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.0",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "openai>=3.46.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
